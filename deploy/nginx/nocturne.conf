# Reference copy of the Nocturne nginx server blocks.
#
# The live config on the Aliyun ECS host is written inline by the
# `deploy-nocturne` skill (see Setup 6 in ~/.claude/skills/deploy-nocturne/SKILL.md).
# This file is version-controlled so reviewers can catch drift between the
# repo reference and the live box.
#
# Install path on host: /etc/nginx/conf.d/nocturne.conf
# After editing on host: nginx -t && systemctl reload nginx
#
# Upstream: the Bun service listens on 127.0.0.1:7701 (see systemd unit).

# ---------- HTTP -> HTTPS redirect for both apex hosts ----------
server {
    listen 80;
    server_name nocturne.eanzhao.com nocturne.eanz.cn;
    return 301 https://$host$request_uri;
}

# ---------- Primary host: nocturne.eanzhao.com ----------
server {
    listen 443 ssl;
    server_name nocturne.eanzhao.com;

    ssl_certificate     /etc/nginx/ssl/eanzhao.com.pem;
    ssl_certificate_key /etc/nginx/ssl/eanzhao.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Public viewer pages (`/v/{page_id}`) are immutable once published —
    # the page_id is a random slug, content never mutates under that URL.
    # Let browsers and the upstream CDN cache them indefinitely.
    location ~ ^/v/ {
        proxy_pass http://127.0.0.1:7701;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API and everything else. `proxy_read_timeout 120s` covers the 45–60s
    # worst case for `POST /format` when the NyxID LLM gateway is doing
    # layout editing on a long input.
    location / {
        proxy_pass http://127.0.0.1:7701;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---------- Alternate host: nocturne.eanz.cn ----------
server {
    listen 443 ssl;
    server_name nocturne.eanz.cn;

    ssl_certificate     /etc/nginx/ssl/eanz.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/eanz.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location ~ ^/v/ {
        proxy_pass http://127.0.0.1:7701;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:7701;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
